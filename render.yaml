services:
  - type: web
    name: outdooroots
    runtime: python
    buildCommand: ./build.sh
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: NODE_VERSION
        value: "20.11.0"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: outdooroots
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: REACT_APP_BACKEND_URL
        sync: false
